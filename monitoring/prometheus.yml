global:
  scrape_interval: 15s      # Alle 15 Sekunden Metriken abrufen
  evaluation_interval: 15s  # Alle 15 Sekunden Alerting-Regeln auswerten

scrape_configs:

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
