services:
  otbr:
    image: openthread/border-router:latest
    container_name: otbr
    network_mode: host
    privileged: true
    environment:
      - TZ=Europe/Berlin
      - OT_RCP_DEVICE=spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=460800
      - OT_LOG_LEVEL=7
      - OT_THREAD_IF=WPAN0
      - OT_INFRA_IF=enp1s0
      - OT_REST_LISTEN_ADDR=0.0.0.0
      - OT_REST_LISTEN_PORT=9212
    volumes:
      - /mnt/data/otbr:/data:rw
    devices:
      - /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_404f78b9f5a2ef1195908c6661ce3355-if00-port0:/dev/ttyUSB0
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: always
