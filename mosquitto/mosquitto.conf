# Netzwerk: Auf welchem Port lauscht Mosquitto?
listener 1883
# 1883 = Standard-MQTT-Port (unverschlüsselt, nur im LAN verwenden)

# Authentifizierung: Passwortdata
password_file /mosquitto/config/passwd

# Persistenz: Nachrichten auf Disk speichern (wichtig für retained messages)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
